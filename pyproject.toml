[project]
name = "cashpath"
version = "1.0.1"
description = "Budget forecasts from one YAML plan: debt payoff dates, savings priorities and net worth, month by month"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5",
    "pandas>=2.2",
    "pydantic>=2.12",
    "pyyaml>=6",
    "streamlit>=1.50",
    "typer>=0.21",
]

[project.scripts]
cashpath = "cashpath.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8",
    "ruff>=0.8",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cashpath", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cashpath"]
